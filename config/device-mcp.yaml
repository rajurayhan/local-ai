mcpSettings:
  allowedAddresses:
    - 'host.docker.internal:8765'
    - '127.0.0.1:8765'

mcpServers:
  SulusPersonal-Files:
    title: SulusPersonal-Files
    description: 'SulusPersonal-Files: Find, search, and read files anywhere on this Mac. Authored by SulusPersonal <raju@sulus.ai>.'
    type: streamable-http
    url: http://host.docker.internal:8765/mcp/files
    timeout: 60000
    apiKey:
      source: admin
      authorization_type: bearer
      key: '${DEVICE_MCP_TOKEN}'
  SulusPersonal-Shell:
    title: SulusPersonal-Shell
    description: 'SulusPersonal-Shell: Run one allowlisted program in the allowed folder. Authored by SulusPersonal <raju@sulus.ai>.'
    type: streamable-http
    url: http://host.docker.internal:8765/mcp/shell
    timeout: 60000
    apiKey:
      source: admin
      authorization_type: bearer
      key: '${DEVICE_MCP_TOKEN}'
  SulusPersonal-Browser:
    title: SulusPersonal-Browser
    description: 'SulusPersonal-Browser: Open pages, list links, fill fields, and return visible text. Authored by SulusPersonal <raju@sulus.ai>.'
    type: streamable-http
    url: http://host.docker.internal:8765/mcp/browser
    timeout: 120000
    apiKey:
      source: admin
      authorization_type: bearer
      key: '${DEVICE_MCP_TOKEN}'
  SulusPersonal-Desktop:
    title: SulusPersonal-Desktop
    description: 'SulusPersonal-Desktop: Open Mac apps or files, use the clipboard, click menus, press shortcuts, type, and capture the screen. Authored by SulusPersonal <raju@sulus.ai>.'
    type: streamable-http
    url: http://host.docker.internal:8765/mcp/desktop
    timeout: 60000
    apiKey:
      source: admin
      authorization_type: bearer
      key: '${DEVICE_MCP_TOKEN}'
  SulusPersonal-Apps:
    title: SulusPersonal-Apps
    description: 'SulusPersonal-Apps: Look up Slack people and channels, read and send Slack as you, and trigger app webhooks. Authored by SulusPersonal <raju@sulus.ai>.'
    type: streamable-http
    url: http://host.docker.internal:8765/mcp/apps
    timeout: 60000
    apiKey:
      source: admin
      authorization_type: bearer
      key: '${DEVICE_MCP_TOKEN}'
  SulusPersonal-Calendar:
    title: SulusPersonal-Calendar
    description: 'SulusPersonal-Calendar: List and create Calendar events and Reminders on this Mac. Authored by SulusPersonal <raju@sulus.ai>.'
    type: streamable-http
    url: http://host.docker.internal:8765/mcp/calendar
    timeout: 60000
    apiKey:
      source: admin
      authorization_type: bearer
      key: '${DEVICE_MCP_TOKEN}'
