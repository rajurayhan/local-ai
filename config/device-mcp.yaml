mcpSettings:
  allowedAddresses:
    - 'host.docker.internal:8765'
    - '127.0.0.1:8765'

mcpServers:
  Sulus-Files:
    title: Sulus-Files
    description: 'Sulus-Files: Find, search, and read files anywhere on this Mac. Authored by Sulus Personal AI <raju@sulus.ai>.'
    type: streamable-http
    url: http://host.docker.internal:8765/mcp/files
    timeout: 60000
    apiKey:
      source: admin
      authorization_type: bearer
      key: '${DEVICE_MCP_TOKEN}'
  Sulus-Shell:
    title: Sulus-Shell
    description: 'Sulus-Shell: Run one allowlisted program in the allowed folder. Authored by Sulus Personal AI <raju@sulus.ai>.'
    type: streamable-http
    url: http://host.docker.internal:8765/mcp/shell
    timeout: 60000
    apiKey:
      source: admin
      authorization_type: bearer
      key: '${DEVICE_MCP_TOKEN}'
  Sulus-Browser:
    title: Sulus-Browser
    description: 'Sulus-Browser: Open pages, list links, fill fields, and return visible text. Authored by Sulus Personal AI <raju@sulus.ai>.'
    type: streamable-http
    url: http://host.docker.internal:8765/mcp/browser
    timeout: 120000
    apiKey:
      source: admin
      authorization_type: bearer
      key: '${DEVICE_MCP_TOKEN}'
  Sulus-Desktop:
    title: Sulus-Desktop
    description: 'Sulus-Desktop: Open Mac apps or files, use the clipboard, click menus, press shortcuts, type, and capture the screen. Authored by Sulus Personal AI <raju@sulus.ai>.'
    type: streamable-http
    url: http://host.docker.internal:8765/mcp/desktop
    timeout: 60000
    apiKey:
      source: admin
      authorization_type: bearer
      key: '${DEVICE_MCP_TOKEN}'
  Sulus-Apps:
    title: Sulus-Apps
    description: 'Sulus-Apps: Look up Slack people and channels, read and send Slack as you, and trigger app webhooks. Authored by Sulus Personal AI <raju@sulus.ai>.'
    type: streamable-http
    url: http://host.docker.internal:8765/mcp/apps
    timeout: 60000
    apiKey:
      source: admin
      authorization_type: bearer
      key: '${DEVICE_MCP_TOKEN}'
  Sulus-Calendar:
    title: Sulus-Calendar
    description: 'Sulus-Calendar: List and create Calendar events and Reminders on this Mac. Authored by Sulus Personal AI <raju@sulus.ai>.'
    type: streamable-http
    url: http://host.docker.internal:8765/mcp/calendar
    timeout: 60000
    apiKey:
      source: admin
      authorization_type: bearer
      key: '${DEVICE_MCP_TOKEN}'
