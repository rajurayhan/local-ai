_metadata:
  major_version: 2
  minor_version: 1
display_information:
  name: RakaAI
  description: Send Slack messages as you from RakaAI agents running on this Mac.
  background_color: "#111827"
features:
  bot_user:
    display_name: RakaAI
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - im:write
      - users:read
      - users:read.email
      - channels:read
      - groups:read
    user:
      - chat:write
      - im:write
      - users:read
      - users:read.email
      - channels:read
      - groups:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
